version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: maintenai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/maintenai
      ML_MODEL_PATH: /app/ml/models/predictive_maintenance_model.pkl
      PREPROCESSOR_PATH: /app/ml/models/preprocessor.pkl
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
